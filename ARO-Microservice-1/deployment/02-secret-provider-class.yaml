apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-trade-secrets
  namespace: trade-app
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AZURE_USER_ASSIGNED_CLIENT_ID}" # Set during ARO cluster provisioning
    keyvaultName: "kv-demo-aro-prod"                            # Azure Key Vault Name
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: trade-api-user
          objectType: secret
          objectVersion: ""
        - |
          objectName: trade-api-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: logging-truststore-password
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"                              # Azure Entra ID Tenant ID
  # Automatically synchronize Azure Key Vault secrets into native OpenShift Secret objects
  secretObjects:
    - secretName: trade-secrets
      type: Opaque
      data:
        - objectName: trade-api-user
          key: APP_SECURITY_USER
        - objectName: trade-api-password
          key: APP_SECURITY_PASSWORD
        - objectName: logging-truststore-password
          key: LOGGING_TRUSTSTORE_PASSWORD
