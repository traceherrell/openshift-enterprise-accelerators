apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-config
  namespace: trade-app
  labels:
    app.kubernetes.io/part-of: trading-platform
data:
  # Inter-service routing URL from Trade Service to Portfolio Service
  PORTFOLIO_SERVICE_URL: "http://portfolio-service.trade-app.svc.cluster.local:8443/api/v1/portfolios"

  # Asynchronous Logging configuration (Empty defaults to non-blocking stdout for ARO cluster logging)
  LOGGING_EXTERNAL_HOST: ""
  LOGGING_EXTERNAL_PORT: "5000"
  LOGGING_SSL_ENABLED: "false"

  # SSL/TLS toggle inside container
  SSL_ENABLED: "false"
