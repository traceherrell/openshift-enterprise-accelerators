apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: payment-app
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: banking-platform
    environment: local-crc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payment-app
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: banking-platform
    environment: local-crc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: banking-platform
    spec:
      serviceAccountName: payment-service-sa
      containers:
        - name: payment-service
          image: image-registry.openshift-image-registry.svc:5000/payment-app/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: https
          env:
            - name: JAVA_OPTIONS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Xmx384m"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8443
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payment-app
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: banking-platform
    environment: local-crc
spec:
  ports:
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app.kubernetes.io/name: payment-service
---
