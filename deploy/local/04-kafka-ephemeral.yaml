# Lightweight Ephemeral Kafka (KRaft mode) for Local CRC Testing
# Configured with writable emptyDir volumes for OpenShift arbitrary UID compatibility.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amq-cluster-kafka
  namespace: payment-app
  labels:
    app.kubernetes.io/name: amq-cluster-kafka
    app.kubernetes.io/part-of: banking-platform
    environment: local-crc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amq-cluster-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amq-cluster-kafka
        app.kubernetes.io/part-of: banking-platform
    spec:
      initContainers:
        - name: init-config
          image: apache/kafka:3.8.0
          command: ['sh', '-c', 'cp -r /opt/kafka/config/* /tmp/config/']
          volumeMounts:
            - name: kafka-config
              mountPath: /tmp/config
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: plaintext
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://amq-cluster-kafka-bootstrap.payment-app.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-logs"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: CLUSTER_ID
              value: "4L622nShTUiBenA3heKdAA"
            - name: LOG_DIR
              value: "/tmp/logs"
          volumeMounts:
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: kafka-logs
              mountPath: /tmp/kafka-logs
            - name: kafka-app-logs
              mountPath: /opt/kafka/logs
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
        - name: kafka-app-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: amq-cluster-kafka-bootstrap
  namespace: payment-app
  labels:
    app.kubernetes.io/name: amq-cluster-kafka
    app.kubernetes.io/part-of: banking-platform
    environment: local-crc
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
  selector:
    app.kubernetes.io/name: amq-cluster-kafka
