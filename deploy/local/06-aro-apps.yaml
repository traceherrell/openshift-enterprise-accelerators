apiVersion: v1
kind: ServiceAccount
metadata:
  name: trade-service-sa
  namespace: trade-app
  labels:
    app.kubernetes.io/name: trade-service
    app.kubernetes.io/part-of: trading-platform
    environment: local-crc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: trade-app
  labels:
    app.kubernetes.io/name: trade-service
    app.kubernetes.io/part-of: trading-platform
    environment: local-crc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-service
        app.kubernetes.io/part-of: trading-platform
    spec:
      serviceAccountName: trade-service-sa
      containers:
        - name: trade-service
          image: image-registry.openshift-image-registry.svc:5000/trade-app/trade-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: https
          env:
            - name: JAVA_OPTIONS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Xmx384m"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: trade-secrets
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8443
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trade-service
  namespace: trade-app
  labels:
    app.kubernetes.io/name: trade-service
    app.kubernetes.io/part-of: trading-platform
    environment: local-crc
spec:
  ports:
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app.kubernetes.io/name: trade-service
---
