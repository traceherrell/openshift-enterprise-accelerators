apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: payment-app
  labels:
    app.kubernetes.io/part-of: banking-platform
data:
  # AMQ Streams configuration
  KAFKA_BOOTSTRAP_SERVERS: "amq-cluster-kafka-bootstrap.amq-streams.svc.cluster.local:9092"
  KAFKA_PAYMENTS_TOPIC: "payments.v1"
  KAFKA_CONSUMER_GROUP: "transaction-processing-group"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"

  # Asynchronous Logging configuration (Empty LOGGING_EXTERNAL_HOST defaults to Async Console stdout)
  LOGGING_EXTERNAL_HOST: ""
  LOGGING_EXTERNAL_PORT: "5000"
  LOGGING_SSL_ENABLED: "false"

  # SSL/TLS toggle inside container
  SSL_ENABLED: "false"
