apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-payment-secrets
  namespace: payment-app
  labels:
    app.kubernetes.io/part-of: banking-platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false" # Set true if using Azure Arc or Managed Identity; false when using Service Principal from On-Prem
    clientID: "${AZURE_CLIENT_ID}" # Azure Service Principal Application/Client ID
    keyvaultName: "${AZURE_KEYVAULT_NAME:-kv-enterprise-secrets}"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: payment-api-user
          objectType: secret
          objectVersion: ""
        - |
          objectName: payment-api-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: kafka-truststore-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: logging-truststore-password
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"
  # Synchronize Azure Key Vault secrets into native OpenShift Secret objects
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: payment-api-user
          key: APP_SECURITY_USER
        - objectName: payment-api-password
          key: APP_SECURITY_PASSWORD
        - objectName: kafka-truststore-password
          key: KAFKA_SSL_TRUSTSTORE_PASSWORD
        - objectName: logging-truststore-password
          key: LOGGING_TRUSTSTORE_PASSWORD
